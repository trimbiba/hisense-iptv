name: Update TV guide

on:
  schedule:
    - cron: "30 3 * * *"   # every day at 03:30 UTC
  workflow_dispatch:       # "Run workflow" button on GitHub
  push:
    paths: [epg/manual.channels.xml, config.json, scripts/build_epg_channels.py]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch iptv-org's guide grabber
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git grabber
          cd grabber && npm install
      - name: List the guide channels
        run: python3 scripts/build_epg_channels.py
      - name: Download the guide
        run: cd grabber && npm run grab --- --channels=../epg/guide.channels.xml --output=../guide.xml --days=3 --maxConnections=5
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml
          git diff --cached --quiet || (git commit -m "Update TV guide" && git pull --rebase && git push)
